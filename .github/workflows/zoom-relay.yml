name: Zoom Relay - Odyssey/Oliver

on:
  push:
    branches: [claude/zoom-transcript-generation-RFmtV]
    paths:
      - '.github/workflows/zoom-relay.yml'
      - '.github/zoom-job.json'
      - 'scripts/zoom_grab.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: zoom-relay
  cancel-in-progress: false

jobs:
  transcribe:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Read job config
        run: |
          set -euo pipefail
          URL=$(jq -r .url .github/zoom-job.json)
          PW=$(jq -r .password .github/zoom-job.json)
          OUT=$(jq -r .output .github/zoom-job.json)
          echo "::add-mask::$PW"
          { echo "PW<<EOF"; echo "$PW"; echo "EOF"; } >> "$GITHUB_ENV"
          echo "URL=$URL" >> "$GITHUB_ENV"
          echo "OUT=$OUT" >> "$GITHUB_ENV"
          mkdir -p work diagnostics

      - name: System deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg jq curl

      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }

      - name: Python deps
        run: |
          pip install --quiet --upgrade pip
          pip install --quiet playwright requests faster-whisper
          playwright install --with-deps chromium

      - name: Grab recording via Playwright
        id: dl
        continue-on-error: true
        run: |
          set -uxo pipefail
          python3 scripts/zoom_grab.py 2>&1 | tee work/grab.log
          test -s work/recording.mp4 || test -s work/recording.m3u8

      - name: Materialize mp4 from HLS if needed
        id: hls
        if: steps.dl.outcome == 'success'
        run: |
          set -euxo pipefail
          if [ -s work/recording.m3u8 ] && [ ! -s work/recording.mp4 ]; then
            ffmpeg -y -hide_banner -loglevel error \
              -headers "$(cat work/headers.txt)" \
              -i work/recording.m3u8 -c copy work/recording.mp4
          fi
          ls -lh work/recording.mp4

      - name: Extract audio
        id: audio
        if: steps.dl.outcome == 'success'
        run: |
          set -euxo pipefail
          IN=$(ls work/recording.mp4 work/recording.* 2>/dev/null | head -1)
          ffmpeg -y -hide_banner -loglevel error \
            -i "$IN" -vn -ac 1 -ar 16000 -c:a libmp3lame -b:a 64k work/audio.mp3
          ls -lh work/audio.mp3

      - name: Transcribe
        id: stt
        if: steps.audio.outcome == 'success'
        run: |
          set -euxo pipefail
          mkdir -p "$(dirname "$OUT")"
          python3 - <<'PY'
          import os, datetime
          from faster_whisper import WhisperModel
          m = WhisperModel("base.en", device="cpu", compute_type="int8")
          segs, info = m.transcribe("work/audio.mp3",
              vad_filter=True, beam_size=1, language="en",
              condition_on_previous_text=False)
          lines = [
            "# Zoom Recording Transcript",
            "",
            "- Meeting: Zoom Call with Odyssey and Oliver Cameron",
            f"- Detected duration: {datetime.timedelta(seconds=int(info.duration))}",
            f"- Language: {info.language} (p={info.language_probability:.2f})",
            "- Model: faster-whisper base.en (int8, CPU)",
            f"- Generated: {datetime.datetime.utcnow().isoformat(timespec='seconds')}Z",
            "", "---", "",
          ]
          for s in segs:
              t = str(datetime.timedelta(seconds=int(s.start)))
              lines.append(f"[{t}] {s.text.strip()}")
          open(os.environ["OUT"],"w").write("\n".join(lines)+"\n")
          print("wrote", os.environ["OUT"], len(lines), "lines")
          PY

      - name: Commit results (always)
        if: always()
        run: |
          set +e
          DBG="diagnostics/run-${{ github.run_id }}.log"
          DUMP="diagnostics/run-${{ github.run_id }}"
          mkdir -p "$DUMP"
          {
            echo "=== run ${{ github.run_id }} sha ${{ github.sha }} ==="
            echo "dl=${{ steps.dl.outcome }} hls=${{ steps.hls.outcome }} audio=${{ steps.audio.outcome }} stt=${{ steps.stt.outcome }}"
            echo ""
            echo "== work/ =="; ls -la work/ 2>/dev/null
            echo ""; echo "== grab.log =="; cat work/grab.log 2>/dev/null
          } > "$DBG"
          for f in work/grab.log work/network.json work/play.html work/screenshot.png work/cookies.json work/headers.txt; do
            [ -f "$f" ] && cp "$f" "$DUMP/$(basename "$f")"
          done
          git config user.name  "zoom-relay-bot"
          git config user.email "zoom-relay-bot@users.noreply.github.com"
          [ -f "$OUT" ] && git add "$OUT"
          git add diagnostics/
          git diff --cached --quiet && { echo "nothing to commit"; exit 0; }
          git commit -m "relay: run ${{ github.run_id }} [skip ci]"
          for i in 1 2 3 4; do git push origin HEAD:${{ github.ref_name }} && exit 0; sleep $((2**i)); done
          exit 1
