name: Zoom Relay - Odyssey/Oliver

on:
  push:
    branches: [claude/zoom-transcript-generation-RFmtV]
    paths:
      - '.github/workflows/zoom-relay.yml'
      - '.github/zoom-job.json'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: zoom-relay
  cancel-in-progress: false

jobs:
  transcribe:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Read job config
        run: |
          set -euo pipefail
          URL=$(jq -r .url .github/zoom-job.json)
          PW=$(jq -r .password .github/zoom-job.json)
          OUT=$(jq -r .output .github/zoom-job.json)
          echo "::add-mask::$PW"
          {
            echo "PW<<EOF"
            echo "$PW"
            echo "EOF"
          } >> "$GITHUB_ENV"
          echo "URL=$URL" >> "$GITHUB_ENV"
          echo "OUT=$OUT" >> "$GITHUB_ENV"
          mkdir -p work diagnostics

      - name: System deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg jq curl

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Python deps
        run: pip install --quiet yt-dlp faster-whisper requests

      - name: Attempt 1 - yt-dlp
        id: dl1
        continue-on-error: true
        run: |
          set -uxo pipefail
          yt-dlp --version | tee -a work/yt-dlp.log
          set +e
          yt-dlp --video-password "$PW" \
            -o 'work/recording.%(ext)s' \
            -f 'best[ext=mp4]/best' \
            --no-progress -v \
            "$URL" >> work/yt-dlp.log 2>&1
          echo "yt-dlp exit: $?" >> work/yt-dlp.log
          ls -lh work/ >> work/yt-dlp.log 2>&1
          test -s work/recording.mp4 || test -s work/recording.webm

      - name: Attempt 2 - manual Zoom auth
        id: dl2
        if: steps.dl1.outcome == 'failure'
        continue-on-error: true
        run: |
          set -uxo pipefail
          python3 <<'PY' 2>&1 | tee -a work/manual.log
          import os, re, sys, json, urllib.parse as up, requests
          url = os.environ["URL"]; pw = os.environ["PW"]
          s = requests.Session()
          s.headers.update({
            "User-Agent":"Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36",
            "Accept":"text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8",
            "Accept-Language":"en-US,en;q=0.9",
          })
          # Step 1: GET the share URL
          r = s.get(url, allow_redirects=True)
          print("step1 GET", r.status_code, r.url)
          html = r.text
          open("work/step1.html","w").write(html)
          parsed = up.urlparse(r.url); base = f"{parsed.scheme}://{parsed.netloc}"
          # Find share id from final URL
          mid = re.search(r'/rec/share/([^/?#]+)', r.url) or re.search(r'/rec/play/([^/?#]+)', r.url)
          file_id = mid.group(1) if mid else ""
          # Look for hidden form fields
          token_m = re.search(r'name="_csrf_token"\s+value="([^"]+)"', html)
          token = token_m.group(1) if token_m else ""
          # Try multiple POST endpoints Zoom has used over the years
          endpoints = [
            f"{base}/rec/validate_meet_passwd",
            f"{base}/rec/validate?meetingId={file_id}",
            r.url,
          ]
          for ep in endpoints:
            data = {"id": file_id, "passwd": pw, "action":"viewdetailpage"}
            if token: data["_csrf_token"] = token
            try:
              r2 = s.post(ep, data=data, allow_redirects=True, timeout=30)
              print("POST", ep, r2.status_code)
              if r2.ok and ("viewMp4Url" in r2.text or "fileUrl" in r2.text or ".mp4" in r2.text):
                html = r2.text; break
            except Exception as e:
              print("err", ep, e)
          # Refetch play page with cookies
          r3 = s.get(r.url, allow_redirects=True)
          print("step3 GET", r3.status_code)
          open("work/step3.html","w").write(r3.text)
          combined = html + "\n" + r3.text
          mp4 = None
          for pat in [r'"viewMp4Url"\s*:\s*"([^"]+)"', r'"fileUrl"\s*:\s*"([^"]+)"', r'(https?://[^"\\\s]+\.mp4[^"\\\s]*)']:
            m = re.search(pat, combined)
            if m:
              mp4 = m.group(1).replace("\\u0026","&").encode().decode("unicode_escape"); break
          if not mp4:
            sys.exit("No mp4 URL found in HTML")
          print("MP4:", mp4)
          with s.get(mp4, stream=True) as v:
            v.raise_for_status()
            with open("work/recording.mp4","wb") as f:
              for c in v.iter_content(1<<20): f.write(c)
          print("size:", os.path.getsize("work/recording.mp4"))
          PY
          test -s work/recording.mp4

      - name: Extract audio
        id: audio
        if: steps.dl1.outcome == 'success' || steps.dl2.outcome == 'success'
        run: |
          set -euxo pipefail
          IN=$(ls work/recording.* 2>/dev/null | head -1)
          ffmpeg -y -hide_banner -loglevel error \
            -i "$IN" -vn -ac 1 -ar 16000 -c:a libmp3lame -b:a 64k work/audio.mp3
          ls -lh work/audio.mp3 | tee -a work/audio.log

      - name: Transcribe
        id: stt
        if: steps.audio.outcome == 'success'
        run: |
          set -euxo pipefail
          mkdir -p "$(dirname "$OUT")"
          python3 - <<'PY'
          import os, datetime
          from faster_whisper import WhisperModel
          model = WhisperModel("base.en", device="cpu", compute_type="int8")
          segs, info = model.transcribe("work/audio.mp3",
              vad_filter=True, beam_size=1, language="en",
              condition_on_previous_text=False)
          lines = [
            "# Zoom Recording Transcript",
            "",
            "- Meeting: Zoom Call with Odyssey and Oliver Cameron",
            f"- Detected duration: {datetime.timedelta(seconds=int(info.duration))}",
            f"- Language: {info.language} (p={info.language_probability:.2f})",
            "- Model: faster-whisper base.en (int8, CPU)",
            f"- Generated: {datetime.datetime.utcnow().isoformat(timespec='seconds')}Z",
            "", "---", "",
          ]
          for s in segs:
              t = str(datetime.timedelta(seconds=int(s.start)))
              lines.append(f"[{t}] {s.text.strip()}")
          out = os.environ["OUT"]
          open(out,"w").write("\n".join(lines)+"\n")
          print("wrote", out, len(lines), "lines")
          PY

      - name: Commit results (always)
        if: always()
        run: |
          set +e
          DBG="diagnostics/run-${{ github.run_id }}.log"
          mkdir -p diagnostics
          {
            echo "=== run info ==="
            echo "run_id: ${{ github.run_id }}"
            echo "sha:    ${{ github.sha }}"
            echo "time:   $(date -u +%FT%TZ)"
            echo ""
            echo "=== outcomes ==="
            echo "dl1   : ${{ steps.dl1.outcome }}"
            echo "dl2   : ${{ steps.dl2.outcome }}"
            echo "audio : ${{ steps.audio.outcome }}"
            echo "stt   : ${{ steps.stt.outcome }}"
            echo ""
            echo "=== job config (password masked) ==="
            jq '.password="<masked>"' .github/zoom-job.json
            echo ""
            echo "=== work/ tree ==="
            ls -la work/ 2>/dev/null
            echo ""
            echo "=== yt-dlp.log (tail 200) ==="
            tail -200 work/yt-dlp.log 2>/dev/null
            echo ""
            echo "=== manual.log ==="
            cat work/manual.log 2>/dev/null
            echo ""
            echo "=== step1.html (first 4000 chars) ==="
            head -c 4000 work/step1.html 2>/dev/null
            echo ""
            echo "=== step3.html (first 4000 chars) ==="
            head -c 4000 work/step3.html 2>/dev/null
          } > "$DBG"
          git config user.name  "zoom-relay-bot"
          git config user.email "zoom-relay-bot@users.noreply.github.com"
          # Stage any transcript and the diagnostic
          [ -f "$OUT" ] && git add "$OUT"
          git add "$DBG"
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          MSG="relay: run ${{ github.run_id }} [skip ci]"
          git commit -m "$MSG"
          for i in 1 2 3 4; do
            git push origin HEAD:${{ github.ref_name }} && exit 0
            sleep $((2**i))
          done
          exit 1
